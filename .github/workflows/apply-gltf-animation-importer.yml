name: Apply glTF Animation Importer

on:
  push:
    branches:
      - feature/gltf-animation-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply glTF animation importer
        run: python3 .github/scripts/apply_gltf_animation_importer.py
      - name: Commit generated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Assets: import glTF skins and animation channels"
          git push
