name: Apply Material Artifact Registration

on:
  push:
    branches:
      - agent/phase2-material-artifacts

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register material artifact
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          module_marker = '    MeshArtifact.cppm\n'
          if '    MaterialArtifact.cppm\n' not in text:
              if module_marker not in text:
                  raise SystemExit('module marker not found')
              text = text.replace(module_marker, module_marker + '    MaterialArtifact.cppm\n', 1)
          test_marker = 'add_executable(KairoAssetsTests tests/AssetTests.cpp)'
          test_line = 'add_executable(KairoAssetsTests tests/AssetTests.cpp tests/MaterialArtifactTests.cpp)'
          if test_line not in text:
              if test_marker not in text:
                  raise SystemExit('test target marker not found')
              text = text.replace(test_marker, test_line, 1)
          cmake.write_text(text)

          umbrella = Path('KairoAssets.cppm')
          text = umbrella.read_text()
          marker = 'export import Kairo.Assets.MeshArtifact;\n'
          line = 'export import Kairo.Assets.MaterialArtifact;\n'
          if line not in text:
              if marker not in text:
                  raise SystemExit('umbrella marker not found')
              umbrella.write_text(text.replace(marker, marker + line, 1))

          Path('.github/workflows/apply-material-artifact-registration.yml').unlink()
          PY
      - name: Commit registration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Register PBR material artifact"
          git push
