name: Apply roadmap portability repair

on:
  push:
    branches:
      - agent/complete-roadmap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/complete-roadmap
          fetch-depth: 0
      - name: Repair Assets portability
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          p = Path("OBJImporter.cppm")
          t = p.read_text()
          if "#include <cerrno>\n" not in t:
              t = t.replace("#include <charconv>\n", "#include <cerrno>\n#include <charconv>\n#include <cstdlib>\n", 1)
          start = t.index("        [[nodiscard]] inline double ParseNumber")
          end = t.index("        [[nodiscard]] inline std::int64_t ParseIndex", start)
          fn = """        [[nodiscard]] inline double ParseNumber(const Token& token, std::size_t line, std::string_view label)
                  {
                      const std::string owned(token.Text);
                      char* parsedEnd = nullptr;
                      errno = 0;
                      const double value = std::strtod(owned.c_str(), &parsedEnd);
                      if (parsedEnd != owned.c_str() + owned.size() || parsedEnd == owned.c_str() ||
                          errno == ERANGE || !std::isfinite(value))
                          Fail(line, token.Column, "invalid finite " + std::string(label) + ".");
                      return value;
                  }

          """
          p.write_text(t[:start] + fn + t[end:])

          p = Path("GLBImporter.cppm")
          t = p.read_text()
          if "import Kairo.Assets.DerivedArtifact;" not in t:
              t = t.replace("import Kairo.Assets.Importer;\n",
                            "import Kairo.Assets.Importer;\nimport Kairo.Assets.DerivedArtifact;\n", 1)
          p.write_text(t)

          p = Path("MaterialArtifact.cppm")
          t = p.read_text()
          old = "        friend bool operator==(const MaterialArtifactData&, const MaterialArtifactData&) = default;"
          new = """        friend bool operator==(const MaterialArtifactData& left, const MaterialArtifactData& right) noexcept
                  {
                      return std::ranges::equal(left.BaseColorFactor, right.BaseColorFactor) &&
                          left.MetallicFactor == right.MetallicFactor &&
                          left.RoughnessFactor == right.RoughnessFactor &&
                          std::ranges::equal(left.EmissiveFactor, right.EmissiveFactor) &&
                          left.NormalScale == right.NormalScale &&
                          left.OcclusionStrength == right.OcclusionStrength &&
                          left.AlphaMode == right.AlphaMode &&
                          left.AlphaCutoff == right.AlphaCutoff &&
                          left.DoubleSided == right.DoubleSided &&
                          left.Textures == right.Textures;
                  }"""
          if old in t:
              t = t.replace(old, new, 1)
          p.write_text(t)
          PY
          python3 /tmp/patch.py
          rm -f .github/workflows/apply-roadmap-portability.yml
          rm -f .github/workflows/apply-portable-obj-float-parser.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Assets portability across Windows and macOS'
          git push origin HEAD:agent/complete-roadmap
