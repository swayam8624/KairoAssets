name: Apply roadmap portability repair

on:
  push:
    branches:
      - agent/complete-roadmap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/complete-roadmap
          fetch-depth: 0
      - name: Repair Assets portability
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/kairo-assets-roadmap.py
          python3 /tmp/kairo-assets-roadmap.py
          rm -f .github/workflows/apply-roadmap-portability.yml
          rm -f .github/workflows/apply-portable-obj-float-parser.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Assets portability across Windows and macOS'
          git push origin HEAD:agent/complete-roadmap
