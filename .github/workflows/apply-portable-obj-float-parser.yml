name: Apply portable OBJ float parser

on:
  push:
    branches:
      - agent/phase2-production-assets

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phase2-production-assets
      - name: Replace unavailable floating from_chars
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('OBJImporter.cppm')
          text = path.read_text()
          text = text.replace('#include <charconv>\n', '#include <cerrno>\n#include <charconv>\n#include <cstdlib>\n', 1)
          old = '''        [[nodiscard]] inline double ParseNumber(const Token& token, std::size_t line, std::string_view label)
        {
            double value = 0.0;
            const char* begin = token.Text.data();
            const char* end = begin + token.Text.size();
            const auto parsed = std::from_chars(begin, end, value, std::chars_format::general);
            if (parsed.ec != std::errc{} || parsed.ptr != end || !std::isfinite(value))
                Fail(line, token.Column, "invalid finite " + std::string(label) + ".");
            return value;
        }'''
          new = '''        [[nodiscard]] inline double ParseNumber(const Token& token, std::size_t line, std::string_view label)
        {
            const std::string owned(token.Text);
            char* parsedEnd = nullptr;
            errno = 0;
            const double value = std::strtod(owned.c_str(), &parsedEnd);
            if (parsedEnd != owned.c_str() + owned.size() || parsedEnd == owned.c_str() ||
                errno == ERANGE || !std::isfinite(value))
                Fail(line, token.Column, "invalid finite " + std::string(label) + ".");
            return value;
        }'''
          if old not in text:
              raise SystemExit('OBJ ParseNumber block was not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/apply-portable-obj-float-parser.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OBJImporter.cppm .github/workflows/apply-portable-obj-float-parser.yml
          git commit -m 'Make OBJ float parsing portable on macOS'
          git push origin HEAD:agent/phase2-production-assets
