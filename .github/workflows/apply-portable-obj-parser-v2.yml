name: Apply portable OBJ parser v2
on:
  push:
    branches:
      - agent/phase1-5-portability-hardening
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phase1-5-portability-hardening
      - run: python3 .github/scripts/patch_obj.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Parse OBJ floats portably across standard libraries"
          git push
