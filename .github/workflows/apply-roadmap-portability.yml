name: Apply roadmap portability repair
on:
  push:
    branches: [agent/complete-roadmap]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/complete-roadmap
          fetch-depth: 0
      - name: Repair cross-platform source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          obj = Path('OBJImporter.cppm')
          text = obj.read_text()
          old = '''        [[nodiscard]] inline double ParseNumber(const Token& token, std::size_t line, std::string_view label)\n        {\n            double value = 0.0;\n            const char* begin = token.Text.data();\n            const char* end = begin + token.Text.size();\n            const auto parsed = std::from_chars(begin, end, value, std::chars_format::general);\n            if (parsed.ec != std::errc{} || parsed.ptr != end || !std::isfinite(value))\n                Fail(line, token.Column, "invalid finite " + std::string(label) + ".");\n            return value;\n        }\n'''
          new = '''        [[nodiscard]] inline double ParseNumber(const Token& token, std::size_t line, std::string_view label)\n        {\n            // Floating-point std::from_chars is still deployment-target gated by\n            // some libc++ releases. OBJ numbers have a deliberately small grammar,\n            // so parse that grammar directly and keep behavior locale-independent.\n            const std::string_view input = token.Text;\n            std::size_t cursor = 0u;\n            bool negative = false;\n            if (cursor < input.size() && (input[cursor] == '+' || input[cursor] == '-'))\n            {\n                negative = input[cursor] == '-';\n                ++cursor;\n            }\n\n            long double significand = 0.0L;\n            bool sawDigit = false;\n            while (cursor < input.size() && input[cursor] >= '0' && input[cursor] <= '9')\n            {\n                sawDigit = true;\n                significand = significand * 10.0L + static_cast<long double>(input[cursor] - '0');\n                ++cursor;\n            }\n\n            int fractionalDigits = 0;\n            if (cursor < input.size() && input[cursor] == '.')\n            {\n                ++cursor;\n                while (cursor < input.size() && input[cursor] >= '0' && input[cursor] <= '9')\n                {\n                    sawDigit = true;\n                    significand = significand * 10.0L + static_cast<long double>(input[cursor] - '0');\n                    ++fractionalDigits;\n                    ++cursor;\n                }\n            }\n            if (!sawDigit) Fail(line, token.Column, "invalid finite " + std::string(label) + ".");\n\n            int exponent = -fractionalDigits;\n            if (cursor < input.size() && (input[cursor] == 'e' || input[cursor] == 'E'))\n            {\n                ++cursor;\n                bool exponentNegative = false;\n                if (cursor < input.size() && (input[cursor] == '+' || input[cursor] == '-'))\n                {\n                    exponentNegative = input[cursor] == '-';\n                    ++cursor;\n                }\n                if (cursor == input.size() || input[cursor] < '0' || input[cursor] > '9')\n                    Fail(line, token.Column, "invalid finite " + std::string(label) + ".");\n                int parsedExponent = 0;\n                while (cursor < input.size() && input[cursor] >= '0' && input[cursor] <= '9')\n                {\n                    const int digit = input[cursor] - '0';\n                    if (parsedExponent > 10000)\n                        Fail(line, token.Column, "numeric exponent is out of range.");\n                    parsedExponent = parsedExponent * 10 + digit;\n                    ++cursor;\n                }\n                exponent += exponentNegative ? -parsedExponent : parsedExponent;\n            }\n            if (cursor != input.size() || exponent < -10000 || exponent > 10000)\n                Fail(line, token.Column, "invalid finite " + std::string(label) + ".");\n\n            long double value = significand;\n            if (exponent != 0) value *= std::pow(10.0L, static_cast<long double>(exponent));\n            if (negative) value = -value;\n            const double result = static_cast<double>(value);\n            if (!std::isfinite(result))\n                Fail(line, token.Column, "invalid finite " + std::string(label) + ".");\n            return result;\n        }\n'''
          if old not in text:
              raise SystemExit('OBJ ParseNumber block changed; refusing blind patch')
          obj.write_text(text.replace(old, new))

          glb = Path('GLBImporter.cppm')
          text = glb.read_text()
          marker = 'import Kairo.Assets.Importer;\n'
          if 'import Kairo.Assets.DerivedArtifact;' not in text:
              if marker not in text:
                  raise SystemExit('GLB importer marker not found')
              text = text.replace(marker, marker + 'import Kairo.Assets.DerivedArtifact;\n', 1)
              glb.write_text(text)

          mat = Path('MaterialArtifact.cppm')
          text = mat.read_text()
          text = text.replace(
              '        friend bool operator==(const MaterialArtifactData&, const MaterialArtifactData&) = default;\n',
              '''        friend bool operator==(const MaterialArtifactData& left, const MaterialArtifactData& right) noexcept\n        {\n            return std::ranges::equal(left.BaseColorFactor, right.BaseColorFactor) &&\n                left.MetallicFactor == right.MetallicFactor &&\n                left.RoughnessFactor == right.RoughnessFactor &&\n                std::ranges::equal(left.EmissiveFactor, right.EmissiveFactor) &&\n                left.NormalScale == right.NormalScale &&\n                left.OcclusionStrength == right.OcclusionStrength &&\n                left.AlphaMode == right.AlphaMode &&\n                left.AlphaCutoff == right.AlphaCutoff &&\n                left.DoubleSided == right.DoubleSided &&\n                left.Textures == right.Textures;\n        }\n''')
          mat.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-roadmap-portability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add OBJImporter.cppm GLBImporter.cppm MaterialArtifact.cppm .github/workflows/apply-roadmap-portability.yml
          git commit -m "Repair Assets portability across Windows and macOS"
          git push origin HEAD:agent/complete-roadmap
