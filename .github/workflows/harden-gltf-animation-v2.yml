name: Harden glTF Animation V2

on:
  push:
    branches:
      - feature/gltf-animation-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden glTF animation v2
        run: python3 .github/scripts/harden_gltf_animation_v2.py
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Assets: harden glTF animation v2 compatibility"
          git push
