name: Rename texture authoring enums
on:
  push:
    branches:
      - agent/phases8-11-authoring-completion
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phases8-11-authoring-completion
      - run: python3 .github/scripts/rename_texture_authoring_enums.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Separate texture authoring enums from runtime artifact semantics"
          git push
