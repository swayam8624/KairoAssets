name: Repair authoring kernels

on:
  push:
    branches:
      - agent/complete-roadmap

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/complete-roadmap
          fetch-depth: 0
      - name: Fix direct standard-library dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          editable = Path('EditableMesh.cppm')
          text = editable.read_text()
          if '#include <limits>\n' not in text:
              text = text.replace('#include <map>\n', '#include <limits>\n#include <map>\n', 1)
          editable.write_text(text)

          sculpt = Path('Sculpting.cppm')
          text = sculpt.read_text()
          if '#include <cstdint>\n' not in text:
              text = text.replace('#include <cstddef>\n', '#include <cstddef>\n#include <cstdint>\n', 1)
          text = text.replace('        const auto midpointFor = [&](EditableVertexID a, EditableVertexID b) mutable -> EditableVertexID {',
                              '        auto midpointFor = [&](EditableVertexID a, EditableVertexID b) -> EditableVertexID {', 1)
          sculpt.write_text(text)

          Path('.github/workflows/repair-authoring-kernels.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix authoring kernel module dependencies'
          git push origin HEAD:agent/complete-roadmap
